baseurl: "https://luckycloveryh.github.io/fuyou/"
languageCode: zh-cn
theme: hugo-theme-stack
paginate: 3
title: 小杨的博客
copyright: 小杨
enableGitInfo: true

# 只使用中文
DefaultContentLanguage: zh-cn
hasCJKLanguage: true

# 禁用多语言
disableLanguages:
    - en
    - ar

services:
    # Change it to your Disqus shortname before using
    disqus:
        shortname: "hugo-theme-stack"
    # GA Tracking ID
    googleAnalytics:
        id:

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: /favicon.png

    footer:
        since: 2020
        customText:

    dateFormat:
        published: 2006-01-02
        lastUpdated: 2006-01-02 15:04 MST

    sidebar:
        emoji: 🌸
        subtitle: 技术分享，日常分享
        avatar:
            enabled: true
            local: false
            src: "https://cdn.jsdelivr.net/gh/luckycloveryh/picgo-bed@main/images/muzimi.gif"

    article:
        math: false
        toc: true
        readingTime: true
        license:
            enabled: true
            default: 本作品采用 CC BY-NC-SA 4.0 许可协议

    comments:
        enabled: true
        provider: utterances

        disqusjs:
            shortname:
            apiUrl:
            apiKey:
            admin:
            adminLabel:

        utterances:
            repo: luckycloveryh/fuyou
            issueTerm: pathname
            label:

        beaudar:
            repo:
            issueTerm: pathname
            label:
            theme:        

        remark42:
            host:
            site:
            locale:

        vssue:
            platform:
            owner:
            repo:
            clientId:
            clientSecret:
            autoCreateIssue: false

        # Waline client configuration see: https://waline.js.org/en/reference/component.html
        waline:
            serverURL:
            lang:
            pageview:
            emoji:
                - https://unpkg.com/@waline/emojis@1.0.1/weibo
            requiredMeta:
                - name
                - email
                - url
            locale:
                admin: Admin
                placeholder:

        twikoo:
            envId:
            region:
            path:
            lang:

        # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
        cactus:
            defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
            serverName: "cactus.chat"
            siteName: "" # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

        giscus:
            repo:
            repoID:
            category:
            categoryID:
            mapping:
            lightTheme:
            darkTheme:
            reactionsEnabled: 1
            emitMetadata: 0

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:

        cusdis:
            host:
            id:
    widgets:
        homepage:
            - type: clock
            - type: archives
              params:
                  limit: 5
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: true
        content:
            enabled: true

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main:
        - identifier: categories-tags
          name: 分类&标签 | Cats&Tags
          url: /categories/
          weight: 10
          params:
              icon: categories

    social:
        - identifier: github
          name: GitHub
          url: https://github.com/luckycloveryh/fuyou
          params:
              icon: brand-github
              newTab: false

        - identifier: bilibili
          name: Bilibili
          url: https://space.bilibili.com/81116666
          params:
              icon: tv
              newTab: false

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4

# 搜索索引配置
outputs:
    home:
        - HTML
        - JSON
    page:
        - HTML
        - JSON

outputFormats:
    JSON:
        mediaType: "application/json"
        baseName: "index"
