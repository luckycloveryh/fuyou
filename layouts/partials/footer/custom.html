<script>
    function initTocHide() {
        // 判断是否存在文章目录
        let toc = document.querySelector(".widget--toc");
        if (!toc) {
            return;
        }
        // 监听滚动
        if (window.fuyouTocScrollHandler) {
            window.removeEventListener('scroll', window.fuyouTocScrollHandler);
        }

        window.fuyouTocScrollHandler = function() {
            //清除class值
            let openUl = document.querySelectorAll(".open");
            if (openUl.length > 0) {
              openUl.forEach((ul) => {
                ul.classList.remove("open")
              })
            }
            // 获取active-class
            let currentLi = document.querySelector(".active-class");
            if (!currentLi) {
                return
            }
            // 展示子ul
            if (currentLi.children.length > 1) {
                currentLi.children[1].classList.add("open")
            }
            // 展示父ul
            let ul = currentLi.parentElement;
            do {
                ul.classList.add("open");
                ul = ul.parentElement.parentElement
            } while (ul !== undefined && (ul.localName === 'ul' || ul.localName === 'ol'))
        };
        window.addEventListener('scroll', window.fuyouTocScrollHandler, { passive: true });
    }
    initTocHide()
</script>

<script>
    /**
     * 滚动回顶部初始化
     */
    function initScrollTop() {
        let btn = document.getElementById("backTopBtn");
        // 添加返回顶部按钮到右侧边栏
        if (!btn) {
            btn = document.createElement("button");
            btn.id = "backTopBtn";
            btn.type = "button";
            btn.setAttribute("aria-label", "Back to top");
            btn.onclick = backToTop;
            document.body.appendChild(btn);
        }
        // 滚动监听
        if (window.fuyouBackTopHandler) {
            window.removeEventListener("scroll", window.fuyouBackTopHandler);
        }

        window.fuyouBackTopHandler = function() {
            // 当网页向下滑动 20px 出现"返回顶部" 按钮
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };
        window.addEventListener("scroll", window.fuyouBackTopHandler, { passive: true });
        window.fuyouBackTopHandler();
    }

    /**
     * 返回顶部
     */
    function backToTop(){
        window.scrollTo({ top: 0, behavior: "smooth" })
    }

    initScrollTop();
</script>

<script>
  function initCodeMoreBox() {
    let codeBlocks = document.querySelectorAll(".highlight");
    if (!codeBlocks) {
      return;
    }
    codeBlocks.forEach(codeBlock => {
      // 校验是否overflow
      if (codeBlock.scrollHeight <= codeBlock.clientHeight) {
        return;
      }
      // 元素初始化
      // codeMoreBox
      let codeMoreBox = document.createElement('div');
      codeMoreBox.classList.add('code-more-box');
      // codeMoreBtn
      let codeMoreBtn = document.createElement('span');
      codeMoreBtn.classList.add('code-more-btn');
      codeMoreBtn.addEventListener('click', () => {
        codeBlock.classList.add('code-show');
        codeMoreBox.style.display = 'none';
        // 触发resize事件，重新计算目录位置
        window.dispatchEvent(new Event('resize'))
      })
      // img
      let img = document.createElement('img');
      img.classList.add('code-more-img');
      img.src = {{ (resources.Get "icons/codeMore.png").Permalink }}
      // 元素添加
      codeMoreBtn.appendChild(img);
      codeMoreBox.appendChild(codeMoreBtn);
      codeBlock.appendChild(codeMoreBox)
    })
  }
  
  initCodeMoreBox();
</script>

<script>
    const cdnPath = "https://cdn.jsdelivr.net/gh/letere-gzj/live2d-widget-v3@main";
    const config = {
        // 资源路径
        path: {
            homePath: "/",
            modelPath: cdnPath + "/Resources/",
            cssPath: {{ (resources.Get "waifu/waifu.css").Permalink }},
            tipsJsonPath: {{ (resources.Get "waifu/waifu-tips.json").Permalink }},
            tipsJsPath: cdnPath + "/waifu-tips.js",
            live2dCorePath: cdnPath + "/Core/live2dcubismcore.js",
            live2dSdkPath: cdnPath + "/live2d-sdk.js"
        },
        // 工具栏
        tools: ["hitokoto", "asteroids", "express", "switch-model", "switch-texture", "photo", "info", "quit"],
        // 模型拖拽
        drag: {
            enable: true,
            direction: ["x", "y"]
        },
        // 模型切换(order: 顺序切换，random: 随机切换)
        switchType: "order"
    }

    // 异步加载资源
    function loadExternalResource(url, type) {
        return new Promise((resolve, reject) => {
            let tag;
            if (type === "css") {
                tag = document.createElement("link");
                tag.rel = "stylesheet";
                tag.href = url;
            }
            else if (type === "js") {
                tag = document.createElement("script");
                tag.src = url;
            }
            if (tag) {
                tag.onload = () => resolve(url);
                tag.onerror = () => reject(url);
                document.head.appendChild(tag);
            }
        });
    }

    // 初始化live2d模型（仅加载一次）
    let live2dInitialized = false;
    function initLive2d() {
        if (live2dInitialized) return;

        if (screen.width >= 768) {
            Promise.all([
                loadExternalResource(config.path.cssPath, "css"),
                loadExternalResource(config.path.live2dCorePath, "js"),
                loadExternalResource(config.path.live2dSdkPath, "js"),
                loadExternalResource(config.path.tipsJsPath, "js")
            ]).then(() => {
                initWidget({
                    waifuPath: config.path.tipsJsonPath,
                    cdnPath: config.path.modelPath,
                    tools: config.tools,
                    dragEnable: config.drag.enable,
                    dragDirection: config.drag.direction,
                    switchType: config.switchType
                });
                live2dInitialized = true;
            }).catch(err => {
                console.error('Failed to load live2d:', err);
            });
        }
    }

    // 页面首次加载时初始化
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLive2d);
    } else {
        initLive2d();
    }
</script>

<!-- 【音乐状态保存】仅处理真正刷新/关闭页面的情况，PJAX切换不需要处理 -->
<script>
    // 页面真正卸载前（刷新/关闭）保存播放状态
    window.addEventListener('beforeunload', () => {
        if (!window.ap) return;
        const playInfo = {
            index: window.ap.list.index,
            currentTime: window.ap.audio.currentTime,
            paused: window.ap.paused
        };
        sessionStorage.setItem('playInfo', JSON.stringify(playInfo));
    });

    // 页面真正加载后（刷新/首次进入）恢复播放状态
    window.addEventListener('load', () => {
        if (!window.ap) return;
        // 只在非PJAX跳转时恢复（PJAX切换APlayer不会中断，无需恢复）
        if (window._pjaxNavigating) return;
        const playInfo = JSON.parse(sessionStorage.getItem('playInfo'));
        if (!playInfo) return;
        window.ap.list.switch(playInfo.index);
        setTimeout(() => {
            window.ap.seek(playInfo.currentTime);
            if (!playInfo.paused) {
                const playPromise = window.ap.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            }
        }, 500);
    });

    // 标记PJAX跳转中，避免load事件误恢复
    document.addEventListener('pjax:send', () => {
        window._pjaxNavigating = true;
    });
    document.addEventListener('pjax:complete', () => {
        window._pjaxNavigating = false;
    });
</script>


<!-- 【无刷新切换配置】 -->
<script>
    window.fuyouPjaxInitialized = window.fuyouPjaxInitialized || false;

    function reinitFuyouPageScripts() {
        try {
            if (window.Stack && window.Stack.init) {
                window.Stack.init();
            }
        } catch(e) {
            console.warn('Stack初始化失败:', e);
        }

        try {
            if (typeof initTocHide === 'function') initTocHide();
            if (typeof initScrollTop === 'function') initScrollTop();
            if (typeof initCodeMoreBox === 'function') initCodeMoreBox();
            if (typeof showHideView === 'function') showHideView();
            if (typeof renderKaTeX === 'function') renderKaTeX();
        } catch(e) {
            console.warn('页面脚本重新初始化失败:', e);
        }

        try {
            if (typeof RENDERER !== 'undefined') {
                RENDERER.setup();
            }
        } catch(e) {
            console.warn('底部小鱼初始化失败:', e);
        }
    }

    function shouldFuyouHandleLink(event, link) {
        if (!link || event.defaultPrevented) return false;
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return false;
        if (link.target && link.target !== '_self') return false;
        if (link.hasAttribute('download')) return false;

        const url = new URL(link.href, window.location.href);
        if (url.origin !== window.location.origin) return false;
        if (!url.pathname.startsWith({{ .Site.Home.RelPermalink }})) return false;
        if (url.pathname === window.location.pathname && url.search === window.location.search) return false;
        if (url.hash && url.pathname === window.location.pathname && url.search === window.location.search) return false;

        return true;
    }

    async function fuyouLoadPage(url, pushState) {
        document.dispatchEvent(new CustomEvent('pjax:send'));
        window._pjaxNavigating = true;

        try {
            const response = await fetch(url, {
                headers: {
                    'X-Requested-With': 'fuyou-pjax'
                },
                credentials: 'same-origin'
            });
            if (!response.ok) {
                throw new Error('HTTP ' + response.status);
            }

            const html = await response.text();
            const nextDocument = new DOMParser().parseFromString(html, 'text/html');
            const nextContainer = nextDocument.querySelector('.main-container');
            const currentContainer = document.querySelector('.main-container');

            if (!nextContainer || !currentContainer) {
                window.location.href = url;
                return;
            }

            document.title = nextDocument.title;
            document.body.className = nextDocument.body.className;
            currentContainer.replaceWith(nextContainer);

            const currentPjaxBlocks = document.querySelectorAll('.js-Pjax');
            const nextPjaxBlocks = nextDocument.querySelectorAll('.js-Pjax');
            currentPjaxBlocks.forEach((block, index) => {
                if (nextPjaxBlocks[index]) {
                    block.replaceWith(nextPjaxBlocks[index]);
                }
            });

            if (pushState) {
                history.pushState({ fuyouPjax: true }, '', url);
            }

            window.scrollTo({ top: 0, behavior: 'auto' });
            reinitFuyouPageScripts();
            document.dispatchEvent(new CustomEvent('pjax:complete'));
        } catch (error) {
            console.warn('无刷新切换失败，回退到普通跳转:', error);
            window.location.href = url;
        } finally {
            window._pjaxNavigating = false;
        }
    }

    window.addEventListener('load', () => {
        if (window.fuyouPjaxInitialized) return;
        window.fuyouPjaxInitialized = true;
        history.replaceState({ fuyouPjax: true }, '', window.location.href);

        document.addEventListener('click', (event) => {
            const link = event.target.closest && event.target.closest('a[href]');
            if (!shouldFuyouHandleLink(event, link)) {
                return;
            }
            event.preventDefault();
            fuyouLoadPage(link.href, true);
        });

        window.addEventListener('popstate', () => {
            fuyouLoadPage(window.location.href, false);
        });

        window.pjax = {
            refresh: function() {},
            loadUrl: function(url) {
                fuyouLoadPage(url, true);
            }
        };
    });
</script>

<script>
    async function renderKaTeX() {
        // 判断当前页面是否有KateX
        let katex = document.querySelector(".math-katex");
        if (!katex) {
            return;
        }
        // 等待函数加载成功后，再执行渲染方法
        while (typeof renderMathInElement !== 'function') {
            await delay(500);
        }        
        // KaTeX渲染方法
        renderMathInElement(document.body, {
            delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\(", right: "\\)", display: false },
                { left: "\\[", right: "\\]", display: true }
            ],
            ignoredClasses: ["gist"]
        });
    }
    
    /**
     * 同步延迟
     */
    function delay(time) {
        return new Promise(resolve => {
            setTimeout(resolve, time)
        })
    }

    document.addEventListener('pjax:complete', () => {
        renderKaTeX();
    })
</script>

<!-- vercount的脚本；若用不蒜子，则更换成不蒜子的脚本就好 -->
<script defer src="https://cn.vercount.one/js"></script>

<script>
    function showHideView() {
        // 判断是否存在vercount标签
        let viewCounts = document.querySelectorAll("#viewCount");
        if (viewCounts) {
            // 判断是否为文章页
            let article =  document.querySelector(".article-page");
            if (!article) {
                viewCounts.forEach(ele => {
                    ele.style.display = 'none';
                });
            }
        }
    }
    
    showHideView();
</script>
